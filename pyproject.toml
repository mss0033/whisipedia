[project]
name = "whisipedia"
version = "0.1.0"
description = "Self-maintaining offline library of high-value open knowledge"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.17",
  "pyright>=1.1.400",
  "pre-commit>=4",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "TID"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["wsp_*"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["packages"]
exclude = ["**/.venv", "**/node_modules"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
markers = [
  "network: test touches the network (excluded from offline CI)",
  "slow: long-running test",
]
