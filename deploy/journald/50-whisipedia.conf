# Keep the journal for weeks, not hours. Install as root, once (docs/runbooks/install-services.md,
# "Journal retention"):
#   sudo install -D -m 0644 deploy/journald/50-whisipedia.conf /etc/systemd/journald.conf.d/50-whisipedia.conf
#   sudo systemctl restart systemd-journald
#
# 2026-11-05 deep dive: `journalctl --user` reached back only about 14 hours, so every "journalctl
# --user -u ..." an alert suggested came back empty by the next morning. The WSL VM's clock jumps
# backwards now and then (it is corrected from Windows' clock), and journald starts new files on every
# jump ("Time jumped backwards, rotating": 50 times in one day). Its default cap of 100 files in /var/log/journal, the
# system and the user journals together, then dropped the oldest archive at each rotation, while the
# 100 files took only ~370 MB of the disk. So the cap is on the number of files, with room to spare.
#
# It must be the system's drop-in: a user's ~/.config/systemd/journald.conf.d is not read, because the
# system journald writes the user journals (user-1000@*.journal) too.

[Journal]
SystemMaxFiles=2000
SystemMaxUse=2G
