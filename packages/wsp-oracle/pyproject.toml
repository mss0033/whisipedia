[project]
name = "wsp-oracle"
version = "0.1.0"
description = "Whisipedia Oracle: chunking, embeddings, ANN, router, hybrid search, and reranking"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "wsp-index",
  "numpy>=2.0",
  "pyarrow>=17",
  "usearch>=2.21",  # binary HNSW (PLAN §9.4); see docs/adr/0007-oracle-models.md
]

[project.optional-dependencies]
# Real models. Without this extra the package still imports, type-checks and runs on fakes.
gpu = [
  "torch>=2.8",
  "transformers>=4.56",
]

[project.scripts]
wsp-oracle-embed = "wsp_oracle.embedbuild:main"
wsp-oracle-eval = "wsp_oracle.evaluation:main"

[tool.uv.sources]
wsp-core = { workspace = true }
wsp-index = { workspace = true }

[dependency-groups]
dev = [
  "wsp-core[testing]",
  "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_oracle"]
