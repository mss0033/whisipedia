[project]
name = "wsp-core"
version = "0.1.0"
description = "Whisipedia domain model, ports (interfaces), config and registry"
requires-python = ">=3.12"
dependencies = [
  "blake3>=1.0",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_core"]
