[project]
name = "wsp-cli"
version = "0.1.0"
description = "The `wsp` command-line interface"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "wsp-api",
  "wsp-sdk",
  "uvicorn>=0.30",
]

[project.scripts]
wsp = "wsp_cli.main:main"

[dependency-groups]
dev = ["wsp-core[testing]"]

[tool.uv.sources]
wsp-core = { workspace = true }
wsp-api = { workspace = true }
wsp-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_cli"]
