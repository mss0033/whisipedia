[project]
name = "wsp-api"
version = "0.1.0"
description = "Whisipedia HTTP API (/v1, OpenAPI 3.1), change-feed SSE and Navigator static host"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "fastapi>=0.143",  # native telemetry switch (we turn it off)
  "httpx>=0.27",
  "pydantic>=2.9",
]

[tool.uv.sources]
wsp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_api"]
