[project]
name = "wsp-adapters"
version = "0.1.0"
description = "Whisipedia source adapters (Kiwix, Wikimedia, Wikidata, arXiv, PubMed, CourtListener, Open Library, Gutenberg, OSM) and snapshot diffing"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "libzim>=3.6",
  "selectolax>=0.3.27",
  "zstandard>=0.23",
  "indexed-bzip2>=1.6",
  "osmium>=4.0",
  "pypdfium2>=4.30",
  "numpy>=2.0",
]

[project.entry-points."whisipedia.adapters"]
kiwix-opds = "wsp_adapters.kiwix:KiwixMirrorAdapter"  # Kiwix's hosts refuse robots (2026-10)
wikimedia-dumps = "wsp_adapters.wikimedia:WikimediaDumpsAdapter"
wikidata = "wsp_adapters.wikidata:WikidataAdapter"
arxiv = "wsp_adapters.arxiv:ArxivAdapter"
pubmed = "wsp_adapters.pubmed:PubmedAdapter"
courtlistener = "wsp_adapters.courtlistener:CourtListenerAdapter"
open-library = "wsp_adapters.openlibrary:OpenLibraryAdapter"
gutenberg = "wsp_adapters.gutenberg:GutenbergAdapter"
osm-planet = "wsp_adapters.osm:OsmPlanetAdapter"
doc-collection = "wsp_adapters.doccollection:DocCollectionAdapter"
us-law = "wsp_adapters.uslaw:UsLawAdapter"
dailymed = "wsp_adapters.dailymed:DailyMedAdapter"
ncbi-bookshelf = "wsp_adapters.bookshelf:BookshelfAdapter"
map-tiles = "wsp_adapters.maptiles:MapTilesAdapter"
weather-data = "wsp_adapters.weatherfiles:WeatherDataAdapter"
american-stories = "wsp_adapters.americanstories:AmericanStoriesAdapter"
pmc-oa = "wsp_adapters.pmc:PmcAdapter"
openalex = "wsp_adapters.bulkdata:OpenAlexAdapter"
loc-ocr-batches = "wsp_adapters.bulkdata:ChroniclingAmericaOcrAdapter"

[dependency-groups]
dev = ["wsp-core[testing]"]

[tool.uv.sources]
wsp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_adapters"]
