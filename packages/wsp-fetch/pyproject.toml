[project]
name = "wsp-fetch"
version = "0.1.0"
description = "Whisipedia Fetcher implementations: segmented multi-mirror HTTP, Metalink, aria2 (PLAN §6.5)"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "blake3>=1.0",
  "httpx>=0.28",
]

[tool.uv.sources]
wsp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_fetch"]
