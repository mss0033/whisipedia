[project]
name = "wsp-vault"
version = "0.1.0"
description = "Whisipedia vault: atomic storage, sealing, signing, ledger, scrub and repair"
requires-python = ">=3.12"
dependencies = [
  "wsp-core",
  "blake3>=1.0",
  "cryptography>=43",
]

[dependency-groups]
dev = ["wsp-core[testing]"]

[tool.uv.sources]
wsp-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp_vault"]
