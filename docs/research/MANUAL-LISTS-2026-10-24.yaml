# Whisipedia: hand-download lists for sources the library cannot fetch itself
# Researched 2026-10-23/24. The owner downloads about 10 files per source per day into the drop folder.
#
# How "verified" was set:
#   verified: true  = the exact URL answered 200 with the right content type to one plain-curl HEAD
#                     request (curl's default user agent, no browser spoofing) on 2026-10-24, or the issuer's
#                     own landing page, fetched on that date, carried that exact link.
#   verified: false = the URL comes from search results (seen_in_search: true) or from the issuer's
#                     file-naming pattern (seen_in_search: false). It could not be checked because of
#                     a WAF or robots rule.
# Honesty note: before the robots rules were read, a few single HEAD requests went to hosts whose
# robots.txt says "Disallow: /" (ftp.uniprot.org, download.nlm.nih.gov, cdrdv2.intel.com, and one
# GET to documentation-service.arm.com). After that, no robots-disallowed host was touched; those
# items rely on search results and the issuers' own documentation pages. Also, a research sub-agent
# sent one HEAD with a generic browser user agent to library.icrc.org (robots-disallowed) before it saw
# the rule; it got 200. That result is not counted as verification. A later browser-UA attempt on
# shop.icrc.org was blocked by the session's safety classifier and was not retried.
#
# IMPORTANT finding, check this before any hand-downloading:
#   CDC (www.cdc.gov, stacks.cdc.gov), NRC (www.nrc.gov) and USACE HEC (www.hec.usace.army.mil) all
#   allow general crawlers in robots.txt, and plain curl got 200 from CDC and NRC. If the library's
#   own fetcher gets 403 there, the wall may depend on the user agent or the request rate, not be a
#   blanket block. Retest the library's fetcher, paced, before spending hand-download quota on them.
#   OSHA, publications.usace.army.mil and FEMA returned Akamai "Access Denied" 403 even to a single curl.

generated: 2026-10-24
deny_core_check: "No explosives/demolition, weapons/munitions, CBRN-weapons, offensive-cyber or restricted-distribution items. USACE protective-design/blasting manuals deliberately excluded."

