  - demolition
  - explosive ordnance
  - weapon system
  - weapons system
  - gunnery
  - mortar
  - artillery
  - sniper
  - fire support
  - sabotage
review_keywords:
  - electronic warfare
  - surveillance
  - cyberspace operations
  - information operations
  - reconnaissance
  - security cooperation
neutral_phrases:
  - surveillance detection
  - field hygiene
