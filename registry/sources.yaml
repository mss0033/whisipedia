  - id: rxnorm
    name: "RxNorm monthly releases: the full release (UMLS licence login) and the current prescribable content"
    publisher: "US National Library of Medicine"
    domain: [medicine, reference-data]
    tier: T1
    status: paused
    license: LicenseRef-UMLS-Metathesaurus
    legal_basis: bulk-access-terms
    access:
      adapter: doc-collection
      issuer: "National Library of Medicine"
      key_prefix: rxnorm
      origins: [download.nlm.nih.gov]
      # NLM's files page (www.nlm.nih.gov allows us) names each month's files on download.nlm.nih.gov,
      # whose robots.txt disallows every agent: the owner downloads them (the full release after a
      # free UMLS licence login). The list follows the page, so a new month's file is offered by itself.
      manual: {daily: 10, again_days: 28, list: {kind: discovery}}
      discovery:
        - kind: index-page
          url: "https://www.nlm.nih.gov/research/umls/rxnorm/docs/rxnormfiles.html"
          documents: "download\\.nlm\\.nih\\.gov/.*RxNorm_full(?:_prescribe)?_\\d{8}\\.zip$"
          newest: "/(?P<series>RxNorm_full(?:_prescribe)?)_(?P<date>\\d{8})\\.zip$"
          newest_date_format: "%m%d%Y"
      filter: {allow_all: true, public_issuer: true, data_files: true}
    update: {cadence: P1M, strategy: snapshot-retention}
    size: {bytes: 1.0e9, measured: false, as_of: '2026-10-24'}
    notes: "Normalised names and codes for clinical drugs, linking the US drug vocabularies. The full release needs a free UMLS Metathesaurus licence (the owner's own account); the prescribable subset needs no login. Owner request 2026-10-24."

