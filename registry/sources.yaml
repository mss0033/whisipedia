  - id: rfc
    name: IETF RFCs
    publisher: IETF
    domain: [standards, computing]
    tier: T1
    status: active
    license: LicenseRef-IETF-Trust
    legal_basis: bulk-access-terms
    # The plain-text RFCs through the document-collection lane (no rsync adapter exists): the RFC
    # index lists every RFC with its title; each row's text file is fetched at one request a second.
    # Field exam 2026-10-14: wsp://rfc/9293 was not in the library.
    access:
      adapter: doc-collection
      issuer: IETF RFC Editor
      key_prefix: rfc
      origins: [www.rfc-editor.org]
      rate: {requests_per_second: 1}
      discovery:
        # RFCs published only as PDF (2026-10-17): seven have no .txt at all; six have a .txt that only
        # says the RFC "is available only in PostScript form" (NTP 1119 and 1129, OSPF 1131). Listed
        # first, so these candidates win over the index's rows for the same keys.
        - kind: list
          items:
            - {pub_number: "RFC 8", title: "ARPA Network Functional Specifications", url: "https://www.rfc-editor.org/rfc/rfc8.pdf"}
            - {pub_number: "RFC 9", title: "Host Software", url: "https://www.rfc-editor.org/rfc/rfc9.pdf"}
            - {pub_number: "RFC 51", title: "Proposal for a Network Interchange Language", url: "https://www.rfc-editor.org/rfc/rfc51.pdf"}
            - {pub_number: "RFC 418", title: "Server File Transfer Under TSS/360 At NASA-Ames Research Center", url: "https://www.rfc-editor.org/rfc/rfc418.pdf"}
            - {pub_number: "RFC 500", title: "Integration of data management systems on a computer network", url: "https://www.rfc-editor.org/rfc/rfc500.pdf"}
            - {pub_number: "RFC 530", title: "Report on the Survey Project", url: "https://www.rfc-editor.org/rfc/rfc530.pdf"}
            - {pub_number: "RFC 598", title: "RFC index - December 5, 1973", url: "https://www.rfc-editor.org/rfc/rfc598.pdf"}
            - {pub_number: "RFC 570", title: "Experimental input mapping between NVT ASCII and UCSB On Line System", url: "https://www.rfc-editor.org/rfc/rfc570.pdf"}
            - {pub_number: "RFC 1119", title: "Network Time Protocol (version 2) specification and implementation", url: "https://www.rfc-editor.org/rfc/rfc1119.pdf"}
            - {pub_number: "RFC 1124", title: "Policy issues in interconnecting networks", url: "https://www.rfc-editor.org/rfc/rfc1124.pdf"}
            - {pub_number: "RFC 1128", title: "Measured performance of the Network Time Protocol in the Internet system", url: "https://www.rfc-editor.org/rfc/rfc1128.pdf"}
            - {pub_number: "RFC 1129", title: "Internet Time Synchronization: The Network Time Protocol", url: "https://www.rfc-editor.org/rfc/rfc1129.pdf"}
            - {pub_number: "RFC 1131", title: "OSPF specification", url: "https://www.rfc-editor.org/rfc/rfc1131.pdf"}
        - kind: index-page
          url: "https://www.rfc-editor.org/rfc-index.html"
          rows: tr
          columns: {pub_number: 0, title: 1}
