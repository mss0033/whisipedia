  - id: classics-in-translation
    name: Classics in English translation (public-domain scans)
    publisher: Internet Archive (scans contributed by university libraries)
    domain: [books, history]
    tier: T2
    status: active  # promoted 2026-10-16: fetched and verified (Appian, 2 volumes), fills a field-exam gap
    license: LicenseRef-PD-US
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: Various (public-domain translations)
      key_prefix: classics
      origins: [archive.org]
      currency: {collection: historical}
      discovery:
        # Texts the library lacks elsewhere (no Gutenberg or Wikisource copy). 2026-10-16 field exam:
        # Appian's Roman History (H. White, 1899) was missing; Wikisource links only external scans.
        - kind: archive-org
          query: "identifier:(romanhistoryofap01appi OR romanhistoryofap02appi) AND mediatype:texts"
          provenance: "university-library scans on archive.org of a translation published in 1899 (public domain worldwide)"
          title_volume: true
      filter: {allow_all: true}
    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 1e8, measured: false, as_of: 2026-10-16}
    notes: Add a work here only when no Gutenberg or Wikisource text holds it. Appian, The Roman History, tr. Horace White (1899), vol. I (foreign wars) and vol. II (civil wars).

