  # ---------------------------------------------------------------------------------------------
  # Preparedness & resilience (shelf `preparedness`) and defensive & security literature (shelf
  # `defense`). Research, rubric deltas, boundaries and the doc-collection adapter spec:
  # docs/research/PREPAREDNESS_AND_DEFENSE.md. Boundaries (§3): lawfully public only (PD, open
  # licence, or Distribution Statement A); no CBRN/explosives/weapons/targeting/offensive tooling;
  # mixed collections are filtered per document, with owner review through `wsp proposals`.
  # Scores are in the research doc (`scores` holds integer axes only).
  # ---------------------------------------------------------------------------------------------

  - id: nga-nautical-pubs
    name: NGA nautical publications (Bowditch American Practical Navigator, Pubs 229/249/102/117, Sailing Directions)
    publisher: National Geospatial-Intelligence Agency
    domain: [preparedness, navigation]
    tier: T1
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: National Geospatial-Intelligence Agency
      key_prefix: nga
      origins: [msi.nga.mil]
      discovery: [{kind: api, flavor: nga-msi, url: "https://msi.nga.mil/api/publications/stored-pubs?output=json"}]
      filter: {allow_all: true, allow_image_only: true, distribution: {require: [public-release, published]}}  # scanned tables and charts
      mirrors:
        - {channel: "msi.nga.mil publications API (official): stored-pubs listing + /api/publications/download?key=<s3Key>", status: verified, verified: 2026-10-10, note: "listing 200 JSON with fileSize; download HEAD 200 application/pdf"}
    update: {cadence: P3M, strategy: snapshot-retention}
    size: {bytes: 2e9, measured: false, as_of: 2026-10-10}
    notes: Score 4.6. D11 (2026-10-10) — the web page's direct PDF links were WAF-blocked, but NGA's own publications API lists every file with its size and serves it (verified 200); that is the access path.

