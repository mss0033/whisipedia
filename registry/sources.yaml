            - {pub_number: "Coast Pilot 3", url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/files/cp3/CPB3_WEB.pdf"}
            - {pub_number: "Coast Pilot 4", url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/files/cp4/CPB4_WEB.pdf"}
