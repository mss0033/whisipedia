# Whisipedia source registry: the single source of truth for what the library holds.
# Validated against registry/schema/source.schema.json. Narrative research: docs/research/SOURCES.md
# size.measured = true means it was measured live on size.as_of; false means an estimate.
# update.cadence is set only for a deliberate override of acquirer.cycle (PLAN §6.7); omit it to follow the cycle.
schema_version: 1
sources:
  - id: wikipedia-top10
    name: Wikipedia (top 10 languages by article count)
    publisher: Wikimedia Foundation
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    languages: [en, ceb, de, fr, sv, nl, es, ru, it, pl]
    access:
      adapter: wikimedia-dumps
      endpoints: ["https://dumps.wikimedia.org/", "https://dumps.wikimedia.org/other/incr/"]
      checksums: md5+sha1 (upstream)
      # English pages render with the Kiwix ZIM's HTML (matched by title); text is indexed from the dump.
      rendition: [{lang: en, source: wikipedia-en-zim}]
    update: {strategy: base-plus-incremental}
    size: {current_bytes: 68.4e9, history_7z_bytes: 456.5e9, weekly_incr_bytes: 11.0e9, measured: true, as_of: 2026-10-09}
    retention: {base: yearly, segments: P2Y}
    irreplaceable: false
    scores: {authority: 4, density: 5, uniqueness: 5, license: 5, bulk: 5, health: 5, longevity: 4, cost: 4}

  - id: wikipedia-top10-history
    name: Wikipedia full edit history (top 10 languages)
    publisher: Wikimedia Foundation
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    languages: [en, ceb, de, fr, sv, nl, es, ru, it, pl]
    index: false  # edit history: not search material
    access: {adapter: wikimedia-dumps, job: metahistory7zdump}
    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 456.5e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 2, yearly: forever}}
    notes: Every revision of every page. Refreshed yearly to fill in edits between monthly snapshots (PLAN §6.7).

  - id: wikipedia-en-zim
    name: Wikipedia English (Kiwix ZIM, maxi)
    publisher: Kiwix / Wikimedia
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    index: false  # ZIM edition: renders wikipedia-top10's English pages, which are indexed
    access: {adapter: kiwix-opds, selector: {name: wikipedia_en_all, flavour: maxi}}
    update: {strategy: snapshot-retention}
    size: {bytes: 127.4e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 3, monthly: 12, yearly: forever}}

  - id: wikidata
    name: Wikidata
    publisher: Wikimedia Foundation
    domain: [knowledge-graph]
    tier: T1
    status: active
    license: CC0-1.0
    legal_basis: open-license
    index: false  # needs the full -all.json dump before it is refined
    access: {adapter: wikidata, endpoints: ["https://dumps.wikimedia.org/wikidatawiki/entities/"], languages: [en, de, fr, es, ru, it, nl, pl, sv]}
    update: {strategy: snapshot-retention}
    size: {json_bz2_bytes: 103.3e9, truthy_nt_bz2_bytes: 43.5e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 2, monthly: 12, yearly: forever}}

  - id: wiktionary-en
    name: English Wiktionary
    publisher: Wikimedia Foundation
    domain: [dictionary]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    # Pages render with the Kiwix ZIM's HTML (matched by title): the dump's text loses template output
    # (blank etymologies, empty transclusions; field exam rounds 1-2). Text stays indexed from the dump.
    access: {adapter: wikimedia-dumps, rendition: [{source: kiwix-wiktionary-en-all}], copies: [{source: kiwix-wiktionary-en-all, match: native, why: "the full entry as rendered by Wiktionary"}]}
    update: {strategy: snapshot-retention}
    size: {bytes: 1.6e9, measured: true, as_of: 2026-10-09}

  - id: wikisource-en
    name: English Wikisource
    publisher: Wikimedia Foundation
    domain: [books, primary-sources]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    # Pages render with the Kiwix ZIM's HTML (matched by title): the dump's text loses template output
    # (blank etymologies, empty transclusions; field exam rounds 1-2). Text stays indexed from the dump.
    access: {adapter: wikimedia-dumps, rendition: [{source: kiwix-wikisource-en-all}], copies: [{source: kiwix-wikisource-en-all, match: native, why: "Wikisource's own rendering of this page, with the text it transcludes"}]}
    update: {strategy: snapshot-retention}
    size: {bytes: 3.4e9, measured: true, as_of: 2026-10-09}

  - id: gutenberg
    name: Project Gutenberg
    publisher: Project Gutenberg Literary Archive Foundation
    domain: [books]
    tier: T1
    status: active
    license: LicenseRef-PD-US+PG-terms
    legal_basis: public-domain
    access: {adapter: gutenberg, catalog: "https://www.gutenberg.org/cache/epub/feeds/", reading_copy: gutenberg-zim, copies: [{source: gutenberg-zim, match: link, why: "the illustrated edition"}]}
    update: {strategy: mirror}
    size: {txt_zip_bytes: 11e9, full_mirror_bytes: 1.0e12, measured: false, as_of: 2026-10-09}

  - id: gutenberg-zim
    name: Project Gutenberg (Kiwix ZIM, all languages)
    publisher: Kiwix / Project Gutenberg
    domain: [books]
    tier: T1
    status: active
    license: LicenseRef-PD-US+PG-terms
    legal_basis: public-domain
    index: false  # reader edition of the gutenberg texts, which are indexed
    access: {adapter: kiwix-opds, selector: {name: gutenberg_mul_all}, searched_as: [gutenberg]}
    update: {cadence: P6M, strategy: snapshot-retention}
    size: {bytes: 253.1e9, measured: true, as_of: 2026-10-10}
    notes: Browsable EPUB/HTML for every book. The raw rsync mirror was too slow (about 150 KB/s); plain text and catalogs come from the gutenberg source's bulk feeds.

  - id: classics-in-translation
    name: Classics in English translation (public-domain scans)
    publisher: Internet Archive (scans contributed by university libraries)
    domain: [books, history]
    tier: T2
    status: active  # promoted 2026-10-16: fetched and verified (Appian, 2 volumes), fills a field-exam gap
    license: LicenseRef-PD-US
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: Various (public-domain translations)
      key_prefix: classics
      origins: [archive.org]
      currency: {collection: historical}
      discovery:
        # Texts the library lacks elsewhere (no Gutenberg or Wikisource copy). 2026-10-16 field exam:
        # Appian's Roman History (H. White, 1899) was missing; Wikisource links only external scans.
        - kind: archive-org
          query: "identifier:(romanhistoryofap01appi OR romanhistoryofap02appi) AND mediatype:texts"
          provenance: "university-library scans on archive.org of a translation published in 1899 (public domain worldwide)"
          title_volume: true
      filter: {allow_all: true}
    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 1e8, measured: false, as_of: 2026-10-16}
    notes: Add a work here only when no Gutenberg or Wikisource text holds it. Appian, The Roman History, tr. Horace White (1899), vol. I (foreign wars) and vol. II (civil wars).

  - id: standard-ebooks
    name: Standard Ebooks
    publisher: Standard Ebooks
    domain: [books]
    tier: T1
    status: candidate
    license: CC0-1.0
    legal_basis: open-license
    access:
      adapter: doc-collection
      issuer: Standard Ebooks
      key_prefix: se
      origins: [github.com, api.github.com, codeload.github.com]
      # Each book is a public GitHub repository of its EPUB source (CC0). The site's robots.txt keeps
      # AI agents off its download pages and its bulk downloads are for patrons, so the books come from
      # the repositories: the organisation listed 100 a page, each book's default branch as one zip,
      # read whole (doccollection.structured, reader standard-ebooks: the chapters in reading order).
      reader: standard-ebooks
      discovery:
        - {kind: git, org: standardebooks, match: "^[a-z0-9-]+_[a-z0-9-]+", snapshot: true}
      filter: {allow_all: true}
    update: {cadence: P3M, strategy: snapshot-retention}
    size: {bytes: 3e9, measured: false, as_of: 2026-10-18}
    notes: Carefully corrected and typeset public-domain books (mostly from Project Gutenberg transcriptions); ~1,400 titles.

  - id: open-library
    name: Open Library dumps
    publisher: Internet Archive
    domain: [catalog]
    tier: T1
    status: active
    license: CC0-1.0
    legal_basis: open-license
    access: {adapter: open-library, endpoints: ["https://openlibrary.org/data/"]}
    update: {strategy: snapshot-retention}
    size: {bytes: 16.7e9, measured: true, as_of: 2026-10-09}

  - id: openstax
    name: OpenStax textbooks
    publisher: Rice University
    domain: [textbooks]
    tier: T1
    status: candidate
    license: CC-BY-4.0
    legal_basis: open-license
    access:
      adapter: doc-collection
      issuer: OpenStax (Rice University)
      key_prefix: openstax
      origins: [openstax.org, assets.openstax.org]
      # The CMS API lists every book with its print PDF (129 books, 2026-10-18); a long PDF is read as
      # its chapters. The CNXML sources on GitHub need a reader of their own; the PDFs are the book.
      discovery: [{kind: api, flavor: openstax}]
      filter: {allow_all: true}
    update: {cadence: P6M, strategy: snapshot-retention}
    size: {bytes: 8e9, measured: false, as_of: 2026-10-09}
    notes: Peer-reviewed open textbooks (CC BY 4.0; a few CC BY-NC-SA, read per book from the PDF).

  - id: arxiv
    name: arXiv
    publisher: Cornell University
    domain: [science]
    tier: T1
    status: candidate
    license: LicenseRef-per-item
    legal_basis: bulk-access-terms
    access: {adapter: arxiv, oai_endpoint: "https://oaipmh.arxiv.org/oai", oai_interval: 3, pdf_months: 2, pdf_text: false}
    update: {strategy: base-plus-incremental}
    size: {bytes: 10e12, measured: false, as_of: 2026-10-09}
    notes: Metadata by OAI-PMH (oaipmh.arxiv.org since 2025, <= 1 request / 3 s). PDFs from the free public arxiv-dataset GCS mirror (D4); the bulk pull is ingested chunk by chunk as part generations <snapshot>.pdf.<archive>-<yymm>.

  - id: pubmed
    name: PubMed baseline + updates
    publisher: US National Library of Medicine
    domain: [medicine, science]
    tier: T1
    # Paused 2026-10-23: ftp.ncbi.nlm.nih.gov's robots.txt disallows every agent, over HTTPS and over
    # FTP alike (ftp://ftp.ncbi.nlm.nih.gov/robots.txt, "Disallow: /"; RFC 9309 covers FTP). D16 was
    # decided on the belief that FTP had no robots.txt (2026-10-24): back to the owner.
    status: paused
    license: LicenseRef-NLM-terms
    legal_basis: bulk-access-terms
    # Research abstracts: no medicine-domain ranking bonus, so practical references (MDWiki, Wikipedia)
    # lead lay questions at equal relevance ("how to treat a snake bite" led with 1890s case reports).
    rank_prior: 0
    access:
      adapter: pubmed
      endpoints: ["ftp://ftp.ncbi.nlm.nih.gov/pubmed/baseline/", "ftp://ftp.ncbi.nlm.nih.gov/pubmed/updatefiles/"]
      # The owner downloads the new update files by hand (wsp collections manual --sync, 2026-10-24): the
      # next numbers after the newest sealed generation, about one a day.
      manual: {daily: 10, list: {kind: pubmed}}
    update: {strategy: base-plus-incremental}
    size: {files: 1334, bytes: 50e9, measured: false, as_of: 2026-10-09}

  - id: pmc-oa
    name: PubMed Central Open Access subset
    publisher: US National Library of Medicine
    domain: [medicine, science]
    tier: T1
    status: candidate
    license: LicenseRef-per-item
    legal_basis: open-license
    access:
      adapter: pmc-oa
      # ADR-0010: 50,000 PMC ids a partition (p0000 ...), `wsp bulk fetch --source pmc-oa --partition
      # p0193 --parallel 8`, then `wsp ingest`. The text and metadata of each article; not the XML,
      # PDFs or figures (several TB). The FTP bulk packages were withdrawn in August 2026.
      partitioned: true
    # Indexed partition by partition once one partition's index size is measured: about 8 million
    # full-text articles would otherwise outgrow the local index disk.
    index: false
    update: {cadence: P1M, strategy: snapshot-retention}
    size: {records: 8e6, bytes: 350e9, measured: false, as_of: 2026-10-18}
    notes: 2026-10-18 owner asked for it. Text-only estimate; the whole bucket with PDFs and figures is about 5 TB. Licence per article (license_code; TDM for author manuscripts).

  - id: openalex
    name: OpenAlex snapshot
    publisher: OurResearch
    domain: [science, catalog]
    tier: T2
    status: candidate
    license: CC0-1.0
    legal_basis: open-license
    access:
      adapter: openalex
      # ADR-0010: one entity a partition (works, authors, sources, institutions, topics, ...) of the
      # Parquet snapshot in the public bucket; `wsp bulk fetch --source openalex --partition works`.
      partitioned: true
    index: false  # 465 million works: kept whole for a reader of their own, not the full-text index
    update: {cadence: P3M, strategy: snapshot-retention}
    size: {records: 465e6, bytes: 800e9, measured: true, as_of: 2026-10-18}
    notes: 2026-10-18 owner asked for it. The S3 path moved to data/parquet/<entity>/ (manifest.json each); works alone is 744 GB.

