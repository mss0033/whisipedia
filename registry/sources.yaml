    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 456.5e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 2, yearly: forever}}
    notes: Every revision of every page. Refreshed yearly to fill in edits between monthly snapshots (PLAN §6.7).

