            - {pub_number: "Coast Pilot 7", url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/files/cp7/CPB7_WEB.pdf"}
            - {pub_number: "Coast Pilot 8", url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/files/cp8/CPB8_WEB.pdf"}
            - {pub_number: "Coast Pilot 9", url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/files/cp9/CPB9_WEB.pdf"}
        - {kind: index-page, url: "https://nauticalcharts.noaa.gov/publications/coast-pilot/index.html", documents: "nauticalcharts\\.noaa\\.gov/publications/(docs|coast-pilot)/.+\\.pdf$"}
      filter: {allow_all: true, distribution: {require: [public-release, published]}}
    update: {cadence: P3M, strategy: snapshot-retention}
    size: {enc_all_bytes: 829.4e6, measured: true, as_of: 2026-10-10}
    notes: Score 4.3. ENC zip is rebuilt daily upstream; a quarterly snapshot is enough offline. Coast Pilot ≈ 0.2 GB (volume 1 measured at 7.7 MB).

