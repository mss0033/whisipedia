# Whisipedia source registry: the single source of truth for what the library holds.
# Validated against registry/schema/source.schema.json. Narrative research: docs/research/SOURCES.md
# size.measured = true means it was measured live on size.as_of; false means an estimate.
# update.cadence is set only for a deliberate override of acquirer.cycle (PLAN §6.7); omit it to follow the cycle.
schema_version: 1
sources:
  - id: wikipedia-top10
    name: Wikipedia (top 10 languages by article count)
    publisher: Wikimedia Foundation
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    languages: [en, ceb, de, fr, sv, nl, es, ru, it, pl]
    access:
      adapter: wikimedia-dumps
      endpoints: ["https://dumps.wikimedia.org/", "https://dumps.wikimedia.org/other/incr/"]
      checksums: md5+sha1 (upstream)
      # English pages render with the Kiwix ZIM's HTML (matched by title); text is indexed from the dump.
      rendition: [{lang: en, source: wikipedia-en-zim}]
    update: {strategy: base-plus-incremental}
    size: {current_bytes: 68.4e9, history_7z_bytes: 456.5e9, weekly_incr_bytes: 11.0e9, measured: true, as_of: 2026-10-09}
    retention: {base: yearly, segments: P2Y}
    irreplaceable: false
    scores: {authority: 4, density: 5, uniqueness: 5, license: 5, bulk: 5, health: 5, longevity: 4, cost: 4}

  - id: wikipedia-top10-history
    name: Wikipedia full edit history (top 10 languages)
    publisher: Wikimedia Foundation
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    languages: [en, ceb, de, fr, sv, nl, es, ru, it, pl]
    index: false  # edit history: not search material
    access: {adapter: wikimedia-dumps, job: metahistory7zdump}
    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 456.5e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 2, yearly: forever}}
    notes: Every revision of every page. Refreshed yearly to fill in edits between monthly snapshots (PLAN §6.7).

  - id: wikipedia-en-zim
    name: Wikipedia English (Kiwix ZIM, maxi)
    publisher: Kiwix / Wikimedia
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    index: false  # ZIM edition: renders wikipedia-top10's English pages, which are indexed
    access: {adapter: kiwix-opds, selector: {name: wikipedia_en_all, flavour: maxi}}
    update: {strategy: snapshot-retention}
    size: {bytes: 127.4e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 3, monthly: 12, yearly: forever}}

  - id: wikidata
    name: Wikidata
    publisher: Wikimedia Foundation
    domain: [knowledge-graph]
    tier: T1
    status: active
    license: CC0-1.0
    legal_basis: open-license
    index: false  # needs the full -all.json dump before it is refined
    access: {adapter: wikidata, endpoints: ["https://dumps.wikimedia.org/wikidatawiki/entities/"], languages: [en, de, fr, es, ru, it, nl, pl, sv]}
    update: {strategy: snapshot-retention}
    size: {json_bz2_bytes: 103.3e9, truthy_nt_bz2_bytes: 43.5e9, measured: true, as_of: 2026-10-09}
    retention: {gfs: {last: 2, monthly: 12, yearly: forever}}

  - id: wiktionary-en
    name: English Wiktionary
    publisher: Wikimedia Foundation
    domain: [dictionary]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    # Pages render with the Kiwix ZIM's HTML (matched by title): the dump's text loses template output
    # (blank etymologies, empty transclusions; field exam rounds 1-2). Text stays indexed from the dump.
    access: {adapter: wikimedia-dumps, rendition: [{source: kiwix-wiktionary-en-all}], copies: [{source: kiwix-wiktionary-en-all, match: native, why: "the full entry as rendered by Wiktionary"}]}
    update: {strategy: snapshot-retention}
    size: {bytes: 1.6e9, measured: true, as_of: 2026-10-09}

  - id: wikisource-en
    name: English Wikisource
