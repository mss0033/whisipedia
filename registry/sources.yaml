      # so documents are the chapter PDFs (not the whole-book EPUB/MOBI), keyed by book and chapter title.
      discovery:
        - kind: index-page
          gatsby: true
          urls:
            - "https://medcoe.army.mil/borden-2-latest-releases"
            - "https://medcoe.army.mil/borden-3-textbooks-of-military-medicine"
            - "https://medcoe.army.mil/borden-4-specialty-titles"
            - "https://medcoe.army.mil/borden-5-military-medical-history"
          follow: "medcoe\\.army\\.mil/borden-[a-z]"
          depth: 1
          documents: "hrcoe\\.amedd\\.army\\.mil/apt/FileDownloadpublic\\.aspx\\?docid="
          documents_skip_text: "\\b(EPUB|MOBI)\\b"  # whole-book ebooks; the chapters are PDFs
          title_strip: "\\s*PDF\\s+file\\s+download\\s*$"
          key_from: text
      # Official Army textbooks of military medicine (public site). The safety screens still apply.
      filter: {allow_all: true, allow_image_only: true, distribution: {require: [public-release, published]}}
    update: {cadence: P3M, strategy: snapshot-retention}
    size: {bytes: 10e9, measured: false, as_of: 2026-10-10}
    notes: Score 4.3. Some chapters carry third-party figures; the text is a federal work.

