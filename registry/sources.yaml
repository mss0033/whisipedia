  - id: nps-calhoun
    name: Naval Postgraduate School Calhoun repository (public-release theses and reports)
    publisher: Naval Postgraduate School
    domain: [defense, science]
    tier: T2
    status: paused  # robots.txt disallows the dspace7 search (2026-10-21); dspace-sitemap replaces it, but Calhoun's item pages are not server-rendered (an empty <ds-app> shell, no metadata, 2026-10-24), so nothing can be selected yet
    license: LicenseRef-per-item
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: Naval Postgraduate School
      key_prefix: nps
      origins: [calhoun.nps.edu]
      oai_endpoint: "https://calhoun.nps.edu/server/oai/request"
      # robots.txt (DSpace 7's stock one, read 2026-10-24) disallows /server/api/* (search, the item API),
      # /server/oai/*, /search and /browse, with Crawl-delay: 10; it allows the sitemaps, the item pages
      # and the bitstream content endpoint, which is all dspace-sitemap reads (2026-10-21 pause lifted).
      # Two sitemaps, 72,213 publications (/entities/publication/). Calhoun answered every item page
      # with a client-side shell on 2026-10-24: the discovery stops after ten such pages and the
      # listing is incomplete, so nothing is fetched until the pages render again. The topics are the
      # research doc §3.3 subjects (the old search queries). Only items whose rights or front matter
      # say "Approved for public release; distribution is unlimited" pass the gate.
      discovery:
        - kind: dspace-sitemap
          base: "https://calhoun.nps.edu"
          cover_page: true  # Calhoun serves each PDF with its citation cover page added
          max_items: 20000  # item pages a run: 2.3 days at the 10 s crawl delay
          topics:
            - "\"mesh network\""
            - "\"wireless sensor network\""
            - "\"software defined radio\""
            - "antenna design"
            - "\"satellite communications\""
            - "\"high frequency\" radio propagation"
            - "microgrid"
            - "\"renewable energy\""
            - "\"water purification\""
            - "\"humanitarian assistance\" disaster relief"
            - "\"disaster response\""
            - "\"supply chain\" logistics"
            - "oceanography"
            - "meteorology forecasting"
            - "\"celestial navigation\" OR \"GPS navigation\""
            - "\"network defense\""
            - "\"power electronics\""
      filter: {allow_all: true, distribution: {require: [public-release]}}
    update: {cadence: P3M, strategy: base-plus-incremental}
    size: {records: 74327, bytes: 100e9, measured: false, as_of: 2026-10-10}
    notes: Score 3.9. Record count measured (OAI completeListSize). Only items stating "Approved for public release; distribution is unlimited", then the subject filter of research doc §3.3.

