  - id: govinfo-collections
    name: GovInfo (GPO) federal publications - Federal Register, Statutes, US Reports, Congress, the presidency, economics
    publisher: US Government Publishing Office
    domain: [law, government, history, economics, reference]
    tier: T1
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      rate: {requests_per_second: 1, concurrency: 3}
      issuer: US Government Publishing Office
      key_prefix: govinfo
      # One partition per GovInfo collection (wsp collections fetch --partition fr|chrg|serialset...).
      # Serial Set volumes, which GPO also files under BUDGET, CRPT and the Journals, are taken once, in
      # the serialset partition. USCOURTS is left out (CourtListener holds the opinions); ECFR and the US
      # Code are us-law's; GOVPUB is listed by the agency sources that use it.
      partitioned: true
      origins: [www.govinfo.gov]
      discovery:
        - {kind: api, flavor: govinfo, collection: FR, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Federal Register, 1936-
        - {kind: api, flavor: govinfo, collection: STATUTE, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Statutes at Large
        - {kind: api, flavor: govinfo, collection: PLAW, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Public and Private Laws
        - {kind: api, flavor: govinfo, collection: USREPORTS, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # United States Reports
        - {kind: api, flavor: govinfo, collection: PPP, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Public Papers of the Presidents
        - {kind: api, flavor: govinfo, collection: CPD, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Compilation of Presidential Documents
        - {kind: api, flavor: govinfo, collection: ERP, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Economic Report of the President
        - {kind: api, flavor: govinfo, collection: ECONI, partition: true, api_key: govinfo, package_skip: ["SERIALSET-"]}  # Economic Indicators
