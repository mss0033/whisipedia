  - id: text-creation-partnership
    name: Text Creation Partnership - EEBO-TCP, ECCO-TCP and Evans-TCP (hand-keyed English books 1473-1800)
    publisher: Text Creation Partnership (University of Michigan, Bodleian Libraries)
    domain: [history, literature, religion, philosophy, science]
    tier: T1
    status: candidate
    license: CC0-1.0
    legal_basis: open-license
    access:
      adapter: doc-collection
      rate: {requests_per_second: 2, concurrency: 2}
      issuer: Text Creation Partnership
      key_prefix: tcp
      # The partnership's catalogue (Texts/TCP.csv, 61,315 rows) names every text; each is one TEI file
      # in its own repository (A00001/A00001.xml), read raw. One partition per series letter: a (EEBO
      # phase I and II), b (EEBO), k (ECCO), n (Evans). Every file's header carries the CC0 waiver.
      reader: tei-tcp
      partitioned: true
      origins: [raw.githubusercontent.com]
      discovery:
        - kind: csv
          url: "https://raw.githubusercontent.com/textcreationpartnership/Texts/master/TCP.csv"
          key: TCP
          title: Title
          date: Date
          url_template: "https://raw.githubusercontent.com/textcreationpartnership/{TCP}/master/{TCP}.xml"
          partition: "{TCP[0]}"
      # B02024: Charles I's proclamation of 1643 pardoning the Office of the Ordnance's "gunners,
      # armourers, gunsmiths, carpenters, wheele-wrights" and summoning them to Oxford; a historical
      # summons, not gunsmithing (its title matched the deny core, 2026-10-24).
      filter:
        allow_all: true
        override_safety: {B02024: "1643 royal proclamation pardoning and summoning Ordnance artificers; history, no gunsmithing content (2026-10-24, under D18; owner may veto)"}
    update: {cadence: P1Y, strategy: snapshot-retention}
    size: {bytes: 1.5e10, measured: false, as_of: '2026-10-24'}
    notes: "61,315 texts (TCP.csv, 2026-10-24): A 48,941, B 4,889 (EEBO), K 2,473 (ECCO), N 5,012 (Evans, early America). The catalogue's 'Restricted' status (28,462 rows) predates the 2020 release of EEBO-TCP phase II: sampled 'Restricted' files are public and carry the CC0 waiver. The early modern spelling is kept as keyed (fiue, heauen). Owner approval D20 (2026-10-24)."

  - id: pubchem
    name: PubChem compounds - identifiers, names, safety summaries (LCSS) and full structure records
    publisher: US National Library of Medicine, National Center for Biotechnology Information
    domain: [chemistry, science, medicine, hazmat, reference-data]
    tier: T1
    # Paused: NCBI's FTP service has a robots.txt that disallows every agent (see pubmed); the fetcher
    # honours it, so nothing is fetched until the owner rules again on D16.
    status: paused
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      # Downloaded by hand from NCBI's https:// folders (the same files as its FTP service, whose robots.txt
      # disallows crawlers too): the owner saves the two folder pages once, then ten files a day,
      # the chemical safety summaries (LCSS) and names first.
      manual:
        daily: 10
        first: ["CID-LCSS", "CID-Title", "CID-Synonym-filtered", "CID-IUPAC", "CID-MeSH", "CID-Mass", "CID-Parent", "CID-Component", "CID-Identifiers", "CID-Date"]
        again_days: 365
        list:
          kind: saved
          pages:
            - {url: "https://ftp.ncbi.nlm.nih.gov/pubchem/Compound/Extras/", save_as: pubchem-extras.html}
            - {url: "https://ftp.ncbi.nlm.nih.gov/pubchem/Compound/CURRENT-Full/SDF/", save_as: pubchem-sdf.html}
      rate: {requests_per_second: 1, concurrency: 2}
      issuer: National Center for Biotechnology Information
      key_prefix: pubchem
      # NCBI's anonymous FTP service (D16, 2026-10-24). Two partitions: extras (CID to names, synonyms, IUPAC names, InChI, SMILES, masses,
      # parents, MeSH, PubMed and patent links, and CID-LCSS.xml.gz, the Laboratory Chemical Safety
      # Summary: GHS hazards and handling for each compound) and sdf (every compound's full record).
      partitioned: true
      origins: [ftp.ncbi.nlm.nih.gov]
      discovery:
        - {kind: index-page, partition: extras, url: "https://ftp.ncbi.nlm.nih.gov/pubchem/Compound/Extras/", documents: "/Compound/Extras/CID-[^/]+(?<!\\.md5)$"}
        - {kind: index-page, partition: sdf, url: "https://ftp.ncbi.nlm.nih.gov/pubchem/Compound/CURRENT-Full/SDF/", documents: "/Compound_\\d+_\\d+\\.sdf\\.gz$"}
      filter: {allow_all: true, public_issuer: true, data_files: true}
    update: {cadence: P6M, strategy: snapshot-retention}
    size: {bytes: 1.44e11, measured: true, as_of: '2026-10-24'}
    notes: "Measured over FTP 2026-10-24: Extras 21 files, 27.3 GB (CID-LCSS.xml.gz 0.48 GB); CURRENT-Full SDF 359 files, 116.8 GB (~120 million compounds). Substances and bioassays (another ~300 GB) are not taken. Owner approval D20; FTP channel D16 (2026-10-24)."

  - id: nara-catalog
    name: National Archives Catalog (NARA) - descriptions of US federal records, with their transcriptions and extracted text
    publisher: US National Archives and Records Administration
    domain: [history, government, archives, reference]
    tier: T2
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      rate: {requests_per_second: 2, concurrency: 3}
      issuer: National Archives and Records Administration
      key_prefix: nara
      # NARA's AWS Open Data bucket (it has no robots.txt; catalog.archives.gov's disallows every agent
      # and is never fetched; owner decision D16, 2026-10-24). JSON lines, one description per line,
      # verified by each object's MD5 ETag. Partitions: one per record group (rg_1 ... rg_589),
      # collections (presidential libraries' and donated collections), authority-records.
      partitioned: true
      origins: [nara-national-archives-catalog.s3.amazonaws.com]
      discovery:
        - {kind: s3-listing, label: nara-record-groups, bucket_url: "https://nara-national-archives-catalog.s3.amazonaws.com", prefix: "descriptions/record-groups/", key_pattern: "\\.jsonl$", partition: "descriptions/record-groups/([^/]+)/", partition_prefix: "descriptions/record-groups/{partition}/"}
        - {kind: s3-listing, label: nara-collections, bucket_url: "https://nara-national-archives-catalog.s3.amazonaws.com", prefix: "descriptions/collections/", key_pattern: "\\.jsonl$", partition: "descriptions/(collections)/", partition_prefix: "descriptions/{partition}/"}
        - {kind: s3-listing, label: nara-authorities, bucket_url: "https://nara-national-archives-catalog.s3.amazonaws.com", prefix: "authority-records/", key_pattern: "\\.jsonl$", partition: "^(authority-records)/", partition_prefix: "{partition}/"}
      filter: {allow_all: true, public_issuer: true, data_files: true}
    update: {cadence: P6M, strategy: snapshot-retention}
    size: {bytes: 9.5e11, measured: true, as_of: '2026-10-24'}
    notes: "Listed 2026-10-24: descriptions/ 366,961 objects, 949 GB (updated to 2026-09-30), authority-records/ 1,961 objects. Kept as data files (no reader yet: a description-per-document reader is a follow-up). The record-group folder coll_Wattenberg (capital letters) is not reached by the lower-cased partitions. The digital objects themselves (NARAprodstorage, TB to PB) are not taken. Owner approval D20, channel D16 (2026-10-24)."

  - id: dla-assist
    name: DLA ASSIST - DoD specifications, standards and handbooks (Distribution A)
    publisher: US Defense Logistics Agency (Document Services)
    domain: [engineering, standards, materials, electronics, reliability, reference]
    tier: T1
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      rate: {requests_per_second: 0.5, concurrency: 1}  # an F5 firewall resets clients that hurry
      issuer: Defense Logistics Agency
      key_prefix: dla-assist
      # ASSIST QuickSearch has no robots.txt. Its searches are ASP.NET postbacks, so every detail page
      # of the ident-number range (1 to ~109,000 in October 2026) is read, in partitions of 10,000
      # (i00 ... i10). Each document's newest Distribution A revision is taken; other statements are
      # never fetched. Owner decision D18 (2026-10-24): weapons, ammunition, explosives, fire control and
      # guided-missile classes left out (FSC 10-14 here, the rules file for the rest).
      partitioned: true
      origins: [quicksearch.dla.mil]
      discovery:
        - {kind: api, flavor: dla-assist, partition: i00, start: 0, stop: 10000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i01, start: 10000, stop: 20000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i02, start: 20000, stop: 30000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i03, start: 30000, stop: 40000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i04, start: 40000, stop: 50000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i05, start: 50000, stop: 60000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i06, start: 60000, stop: 70000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i07, start: 70000, stop: 80000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i08, start: 80000, stop: 90000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i09, start: 90000, stop: 100000, skip_fsc_groups: [10, 11, 12, 13, 14]}
        - {kind: api, flavor: dla-assist, partition: i10, start: 100000, stop: 110000, skip_fsc_groups: [10, 11, 12, 13, 14]}
      filter: {distribution: {require: [A]}, rules: registry/filters/dla-assist.yaml, allow_all: true}
    update: {cadence: P6M, strategy: snapshot-retention}
    size: {bytes: 2.0e11, measured: false, as_of: '2026-10-24'}
    notes: "About 105,000 documents, most of them canceled specifications kept as engineering history (status recorded; current ones include MIL-STD-810 environmental tests, MIL-STD-461 EMI, MIL-HDBK-338 reliability, MIL-STD-1472 human engineering). Adopted industry standards (ASTM, SAE) carry no public image and are not fetched. ~100-300 GB (research 2026-10-23). Owner decisions D18 and D20 (2026-10-24)."

  - id: dila-opendata
    name: DILA OPENDATA - French law in bulk (Légifrance codes and laws, Journal officiel, case law)
    publisher: Direction de l'information légale et administrative (France)
    domain: [law, government]
    tier: T1
    status: candidate
    license: LicenseRef-Licence-Ouverte-2.0
    legal_basis: open-license
    access:
      adapter: doc-collection
      rate: {requests_per_second: 1, concurrency: 2}
      issuer: Direction de l'information légale et administrative
      key_prefix: dila
      # The bulk feed behind Légifrance (echanges.dila.gouv.fr has no robots.txt; legifrance.gouv.fr is
      # behind a bot challenge and is never fetched). Each dataset is a full dump
      # (Freemium_<set>_global_<date>.tar.gz) and a daily delta since; every tarball is kept, so the
      # current state is the dump plus its deltas in order. Kept as data files: a reader that applies
      # the deltas and makes each article a document is a follow-up. One partition per dataset.
      partitioned: true
      origins: [echanges.dila.gouv.fr]
      discovery:
        - {kind: index-page, partition: legi, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/LEGI/", documents: "/OPENDATA/LEGI/[^/]+\\.tar\\.gz$"}  # consolidated codes and laws, with every version
        - {kind: index-page, partition: jorf, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/JORF/", documents: "/OPENDATA/JORF/[^/]+\\.tar\\.gz$"}  # Journal officiel since 1947
        - {kind: index-page, partition: kali, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/KALI/", documents: "/OPENDATA/KALI/[^/]+\\.tar\\.gz$"}  # collective agreements
        - {kind: index-page, partition: cass, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/CASS/", documents: "/OPENDATA/CASS/[^/]+\\.tar\\.gz$"}  # Cour de cassation
        - {kind: index-page, partition: capp, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/CAPP/", documents: "/OPENDATA/CAPP/[^/]+\\.tar\\.gz$"}  # courts of appeal
        - {kind: index-page, partition: inca, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/INCA/", documents: "/OPENDATA/INCA/[^/]+\\.tar\\.gz$"}  # unpublished Cour de cassation rulings
        - {kind: index-page, partition: jade, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/JADE/", documents: "/OPENDATA/JADE/[^/]+\\.tar\\.gz$"}  # Conseil d'État and administrative courts
        - {kind: index-page, partition: constit, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/CONSTIT/", documents: "/OPENDATA/CONSTIT/[^/]+\\.tar\\.gz$"}  # Conseil constitutionnel
        - {kind: index-page, partition: cnil, language: fr, url: "https://echanges.dila.gouv.fr/OPENDATA/CNIL/", documents: "/OPENDATA/CNIL/[^/]+\\.tar\\.gz$"}  # CNIL deliberations
      filter: {allow_all: true, public_issuer: true, data_files: true}
