# Whisipedia source registry: the single source of truth for what the library holds.
# Validated against registry/schema/source.schema.json. Narrative research: docs/research/SOURCES.md
# size.measured = true means it was measured live on size.as_of; false means an estimate.
# update.cadence is set only for a deliberate override of acquirer.cycle (PLAN §6.7); omit it to follow the cycle.
schema_version: 1
sources:
  - id: wikipedia-top10
    name: Wikipedia (top 10 languages by article count)
    publisher: Wikimedia Foundation
    domain: [encyclopedia]
    tier: T1
    status: active
    license: CC-BY-SA-4.0
    legal_basis: open-license
    languages: [en, ceb, de, fr, sv, nl, es, ru, it, pl]
    access:
      adapter: wikimedia-dumps
      endpoints: ["https://dumps.wikimedia.org/", "https://dumps.wikimedia.org/other/incr/"]
      checksums: md5+sha1 (upstream)
      # English pages render with the Kiwix ZIM's HTML (matched by title); text is indexed from the dump.
      rendition: [{lang: en, source: wikipedia-en-zim}]
    update: {strategy: base-plus-incremental}
    size: {current_bytes: 68.4e9, history_7z_bytes: 456.5e9, weekly_incr_bytes: 11.0e9, measured: true, as_of: 2026-10-09}
    retention: {base: yearly, segments: P2Y}
    irreplaceable: false
    scores: {authority: 4, density: 5, uniqueness: 5, license: 5, bulk: 5, health: 5, longevity: 4, cost: 4}

