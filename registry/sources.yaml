    name: CIA FOIA Electronic Reading Room (CREST and declassified collections)
    publisher: Central Intelligence Agency
    domain: [defense, intelligence]
    tier: T2
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: Central Intelligence Agency (FOIA Electronic Reading Room)
      key_prefix: cia-rr
      partitioned: true  # fetch one batch per run: wsp collections fetch --partition b0001 (..b0100)
      origins: [archive.org, www.cia.gov]
      rate: {requests_per_second: 1, concurrency: 4, per_host: {www.cia.gov: 10}}  # 4 in flight: archive.org metadata replies take ~4 s
      discovery:
        - kind: archive-org
          query: "collection:ciareadingroom"
          page_size: 5000  # 10,000-item pages timed out (60 s); the complete listing is cached a week
          buckets: 100  # stable batches b0001..b0100 (~9,850 items each), hashed from the identifier
          # The originals are image-only scans (unscreenable, unsearchable); the Archive's OCR copy has a
          # text layer (about twice the size). Owner-approved collection; the OCR copy is a derivative.
          prefer: text-pdf
          provenance: "Internet Archive's one-to-one mirror of foia.cia.gov (creator 'CIA Reading Room'; identifiers are the CIA document numbers, e.g. CIA-RDP84-00499R000900030045-6); spot-check bytes against www.cia.gov when deep links answer"
      filter: {rules: registry/filters/cia-reading-room.yaml, declassified_ok: true, distribution: {require: [declassified, public-release, published]}, default: allow}
      mirrors:
        - {channel: "www.cia.gov/readingroom", status: degraded, verified: 2026-10-10, note: "home page 200, but document and collection deep links redirect to the home page for a plain client; robots.txt Crawl-delay 10, /readingroom/search/ disallowed"}
        - {channel: "archive.org collection ciareadingroom (mirror of the official release)", status: verified, verified: 2026-10-10, note: "984,230 items with item_size via the scrape API; one item per CIA document"}
    update: {cadence: P3M, strategy: mirror}
    size: {bytes: 7.5e12, measured: false, as_of: 2026-10-10}
    notes: Officially released, declassified documents (≈5-10 TB). Document-level filtering applies (PLAN §13 boundaries); declassified banners with a release stamp are expected and allowed, export-control warnings are not. Included by owner decision D14 (2026-10-10). Acquisition plan in docs/research/PREPAREDNESS_AND_DEFENSE.md §8 (partitioned part generations, ≤1 request/s).

  - id: usgs-historical-topo
    name: USGS Historical Topographic Map Collection
    publisher: US Geological Survey
    domain: [geography, maps]
    tier: T2
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      rate: {requests_per_second: 1, concurrency: 3}  # map PDFs average ~10 s each one at a time
      issuer: US Geological Survey (National Geospatial Program)
      key_prefix: usgs-htmc
      partitioned: true  # fetch one state per run: wsp collections fetch --partition <st>
      origins: [prd-tnm.s3.amazonaws.com, thor-f5.er.usgs.gov]
      discovery:
        - {kind: s3-listing, label: htmc-geopdf, bucket_url: "https://prd-tnm.s3.amazonaws.com", prefix: "StagedProducts/Maps/HistoricalTopo/PDF/", key_pattern: "\\.pdf$", partition: "HistoricalTopo/PDF/([A-Z]{2})/", partition_in_prefix: true}
      filter: {allow_all: true, allow_image_only: true}  # scanned maps: no text layer to screen
      currency: {collection: historical}
      # GeoPDF only (2026-10-12 audit, CA-11): the GeoTIFF of each sheet is the same map without a text
      # layer; it doubled every download and was held. Stored .tif/.zip files leave the index (catalog
      # "excluded: format=tif") at the next refine.
      formats: [pdf]
      mirrors:
        - {channel: "USGS prd-tnm S3 bucket (agency-owned, public)", status: verified, verified: 2026-10-10, note: "ListObjects 200: StagedProducts/Maps/HistoricalTopo/{GeoTIFF,PDF}/; ETag = MD5 for single-part objects"}
        - {channel: "TNM Access API", status: verified, verified: 2026-10-10, note: "186,061 'Historical Topographic Maps' products with sizeInBytes"}
        - {channel: "topomaps_all.zip catalogue (thor-f5.er.usgs.gov)", status: verified, verified: 2026-10-10, note: "96 MB CSV inventory of every map sheet (HEAD 200)"}
    update: {cadence: P1Y, strategy: mirror}
    size: {bytes: 15e12, measured: false, as_of: 2026-10-10}
    notes: Every historical USGS topographic quadrangle (GeoPDF/GeoTIFF, ≈10-20 TB). Included by owner decision D14 (2026-10-10). Maps are historical by nature (the banner applies to old roads, mines and hazards). Acquisition plan in docs/research/PREPAREDNESS_AND_DEFENSE.md §8 (one part generation per state, GeoPDF first).

