  - id: medlineplus
    name: MedlinePlus health topics
    publisher: US National Library of Medicine
    domain: [medicine]
    tier: T1
    status: candidate
    license: LicenseRef-US-Gov-PD
    legal_basis: public-domain
    access:
      adapter: doc-collection
      issuer: US National Library of Medicine
      key_prefix: medlineplus
      origins: [medlineplus.gov]
      # The daily health-topics XML (English and Spanish), each topic a document
      # (doccollection.structured, "medlineplus-topics"). The page lists the newest file first; the
      # constant pub number keeps one document, so the newest wins and an update supersedes it.
      reader: medlineplus-topics
      discovery:
        - {kind: index-page, url: "https://medlineplus.gov/xml.html", documents: "/xml/mplus_topics_\\d{4}-\\d{2}-\\d{2}\\.xml$", pub_number: "(mplus_topics)_\\d"}
      filter: {allow_all: true, builtin_review: false}
    update: {cadence: P1M, strategy: snapshot-retention}
    size: {bytes: 0.03e9, measured: true, as_of: 2026-10-18}
    notes: The Kiwix MedlinePlus ZIM holds the whole site; this is the curated topic summaries, searchable on their own and in Spanish. 2026-10-18 sample read 2,033 topics.

  - id: osm-planet
    name: OpenStreetMap planet
    publisher: OpenStreetMap Foundation
    domain: [geography]
    tier: T1
    status: active
    license: ODbL-1.0
    legal_basis: open-license
    index: false  # map data: not text search material
    # planet.openstreetmap.org's robots.txt disallows every agent but wget (2026-10-23); its official mirror at
    # FAU serves the same planet files and .md5 sidecars, and its robots.txt allows them.
    access: {adapter: osm-planet, endpoints: ["https://ftp.fau.de/osm-planet/pbf/"]}
    notes: The osm-planet adapter takes the weekly planet PBF and emits named places; replication diffs are not applied yet.
    update: {strategy: base-plus-incremental}
    size: {planet_pbf_bytes: 95.2e9, measured: true, as_of: 2026-10-09}

