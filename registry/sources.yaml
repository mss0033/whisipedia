  - id: legislation-gov-uk
    name: legislation.gov.uk - the UK statute book (Acts and Statutory Instruments of every UK legislature, current versions)
    publisher: The National Archives (UK)
    domain: [law, government, history]
    tier: T1
    status: candidate
    license: OGL-UK-3.0
    legal_basis: open-license
    access:
      adapter: doc-collection
      rate: {requests_per_second: 0.2, concurrency: 1}  # robots.txt: Crawl-delay 5
      issuer: The National Archives (legislation.gov.uk)
      key_prefix: uk-leg
      # One partition per type of legislation. Each item is listed once, from its type's "final"
      # sitemaps (as enacted or made), and taken as data.html: the whole item in its latest version
      # (revised where the editors have revised it). robots.txt disallows the data.pdf and data.docx
      # renditions, which are not fetched.
      partitioned: true
      origins: [www.legislation.gov.uk]
      discovery:
        - {kind: sitemap, match: "/contents/(?:enacted|made|adopted|created)$", rewrite: ["/contents/[a-z]+$", "/data.html"], key_pattern: "legislation\\.gov\\.uk/([a-z]+)/(.+)/data\\.html$", expand: true, upgrade_http: true, partition: ukpga, url: "https://www.legislation.gov.uk/sitemap-ukpga.xml", expand_match: "/sitemap-ukpga-final-"}  # UK Public General Acts
        - {kind: sitemap, match: "/contents/(?:enacted|made|adopted|created)$", rewrite: ["/contents/[a-z]+$", "/data.html"], key_pattern: "legislation\\.gov\\.uk/([a-z]+)/(.+)/data\\.html$", expand: true, upgrade_http: true, partition: ukla, url: "https://www.legislation.gov.uk/sitemap-ukla.xml", expand_match: "/sitemap-ukla-final-"}  # UK Local Acts
        - {kind: sitemap, match: "/contents/(?:enacted|made|adopted|created)$", rewrite: ["/contents/[a-z]+$", "/data.html"], key_pattern: "legislation\\.gov\\.uk/([a-z]+)/(.+)/data\\.html$", expand: true, upgrade_http: true, partition: ukppa, url: "https://www.legislation.gov.uk/sitemap-ukppa.xml", expand_match: "/sitemap-ukppa-final-"}  # UK Private and Personal Acts
