    legal_basis: open-license
    index: false
    access:
      adapter: map-tiles
      partitioned: true
      tileset: terrain
      tile_kind: raster-dem
      encoding: terrarium
      priority: 0
      attribution: "© Mapterhorn (mapterhorn.com/attribution): Copernicus GLO-30 and national elevation models"
      discovery:
        kind: parts
        parts:
          - {partition: z0-10, url: "https://download.mapterhorn.com/planet.pmtiles", max_zoom: 10}
          - {partition: z11, url: "https://download.mapterhorn.com/planet.pmtiles", min_zoom: 11, max_zoom: 11}
          - {partition: z12-w180, url: "https://download.mapterhorn.com/planet.pmtiles", min_zoom: 12, max_zoom: 12, bbox: [-180, -85.0511, -90, 85.0511]}
          - {partition: z12-w90, url: "https://download.mapterhorn.com/planet.pmtiles", min_zoom: 12, max_zoom: 12, bbox: [-90, -85.0511, 0, 85.0511]}
          - {partition: z12-e0, url: "https://download.mapterhorn.com/planet.pmtiles", min_zoom: 12, max_zoom: 12, bbox: [0, -85.0511, 90, 85.0511]}
