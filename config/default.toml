# Defaults. Machine-specific values (NAS path, hosts, keys) go in config/local.toml (gitignored).
[vault]
root = "/path/to/library"        # override in local.toml
scrub_cycle_days = 30
parity_percent = 10

[acquirer]
user_agent = "Whisipedia/0.0 (personal offline archive)"
max_connections_per_host = 2
cycle = "monthly"               # "monthly" | "quarterly" (PLAN §6.7)
health_probe_interval = "P1W"

[index]
root = "/path/to/local/index"    # local disk, never SMB (ADR-0002)
