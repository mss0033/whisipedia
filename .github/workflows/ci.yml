name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (network disabled, PLAN §12.4)
        # Loopback stays available for in-process test servers; everything else is unreachable.
        run: >-
          sudo unshare -n -- sh -c 'ip link set lo up &&
          sudo -u "$0" env "PATH=$1" uv run --offline pytest -m "not network"' "$USER" "$PATH"
  navigator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: navigator/package-lock.json
      - run: npm ci
      - run: npm run check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
